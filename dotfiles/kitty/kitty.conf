# ============================================
# 冥人 GHOST OF TSUSHIMA KITTY CONFIG
# ink, paper, lacquer red and gold leaf
# ============================================

# ===== FONT =====
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 14.0
font_features JetBrainsMonoNerdFont-Regular +liga +calt
modify_font cell_height 118%

# ===== CURSOR =====
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

# a red brushstroke trail when the cursor jumps
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ===== SCROLLBACK =====
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ===== MOUSE & URLS =====
mouse_hide_wait 3.0
url_style curly
detect_urls yes
copy_on_select yes
show_hyperlink_targets yes

# ===== BELL =====
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "◆ "

# ===== WINDOW =====
remember_window_size  no
initial_window_width  120c
initial_window_height 34c
window_padding_width 12 16
single_window_margin_width -1
placement_strategy center
window_border_width 1pt
draw_minimal_borders yes
hide_window_decorations titlebar-only
confirm_os_window_close 1

# ===== TAB BAR: slanted powerline =====
tab_bar_edge top
tab_bar_margin_height 6.0 4.0
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 2
tab_title_template " {index}: {title[title.rfind('/')+1:]} "
active_tab_title_template " ◆ {index}: {title[title.rfind('/')+1:]} "
active_tab_font_style bold
inactive_tab_font_style normal

# ===== COLORS =====
include themes/ghost-of-tsushima.conf

# ===== OPACITY & BLUR =====
background_opacity 0.95
background_blur 32
dynamic_background_opacity yes

# ===== MACOS =====
macos_option_as_alt both
macos_quit_when_last_window_closed yes
macos_show_window_title_in window
macos_thicken_font 0.2
macos_colorspace srgb
macos_traditional_fullscreen no

# ===== BEHAVIOUR =====
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
shell_integration enabled
allow_hyperlinks yes
update_check_interval 0
enabled_layouts splits,stack,tall
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# ===== KEYS (cmd on macOS, kitty_mod elsewhere) =====
map cmd+enter       launch --location=vsplit --cwd=current
map cmd+shift+enter launch --location=hsplit --cwd=current
map cmd+t           new_tab_with_cwd
map cmd+w           close_window
map cmd+]           next_window
map cmd+[           previous_window
map cmd+shift+]     next_tab
map cmd+shift+[     previous_tab
map cmd+z           toggle_layout stack
map cmd+equal       change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0
map cmd+k           clear_terminal to_cursor active
map cmd+f           launch --type=overlay --stdin-source=@screen_scrollback less +G -R
map cmd+opt+o       set_background_opacity default
map cmd+opt+1       set_background_opacity 1

map kitty_mod+enter launch --location=vsplit --cwd=current
map kitty_mod+t     new_tab_with_cwd

# ===== SYMBOLS: let the Nerd Font render icons =====
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono
